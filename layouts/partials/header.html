<header class="site-header">
    <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
        <div class="nav-actions">
            <div class="nav-links">
                {{ range .Site.Menus.main }}
                {{ if hasPrefix .URL "http" }}
                <a href="{{ .URL }}" target="_blank" rel="noreferrer">{{ partial "icon.html" .Identifier }}<span>{{ .Name }}</span></a>
                {{ else }}
                <a href="{{ .URL | relURL }}">{{ partial "icon.html" .Identifier }}<span>{{ .Name }}</span></a>
                {{ end }}
                {{ end }}
            </div>
            <button class="theme-toggle" type="button" aria-label="Switch color theme">
                <span class="theme-toggle-light">Light</span>
                <span class="theme-toggle-dark">Dark</span>
            </button>
        </div>
    </nav>
</header>
