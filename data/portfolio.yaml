projects:
  - title: Optimising Network Packet Processing on Low-Power ARM Single-Board Computers
    blogPath: msc-dissertation
    period: 2026
    category: MSc dissertation
    accent: blue
    summary: Extended native XDP support for Raspberry Pi 5 networking and evaluated DPDK-over-AF_XDP against conventional socket paths.
    highlights:
      - Added native XDP and AF_XDP support to the Cadence GEM network driver.
      - Reduced median RTT by 9.41% against TCP and 6.74% against UDP.
      - Measured 24.1% lower TX cost than TCP and about 52% lower RX cost than both baselines.
    technologies: [C, Linux, XDP, AF_XDP, DPDK, Raspberry Pi 5]
  - title: Parallel Actor Framework
    blogPath: parallel-actor-framework
    period: February 2026 - March 2026
    category: Distributed systems
    accent: blue
    summary: Distributed actor runtime in C++ and MPI for scalable, message-driven computation across multiple nodes.
    highlights:
      - Designed locality-aware actor placement and a partitioned 2D computation model.
      - Implemented routing and lifecycle management that avoid ID collisions.
      - Validated the runtime with a distributed Lotka-Volterra simulation.
    technologies: [C++, MPI, Distributed systems]
  - title: FactorZero
    blogPath: factorzero
    period: November 2025
    category: Distributed systems
    accent: green
    summary: Fault-tolerant distributed file system and parallel workload engine built for unreliable network conditions.
    highlights:
      - Combined whole-file caching, primary-backup replication, and heartbeat-based failover.
      - Built coordinator-worker execution for parallel primality testing with recovery.
      - Used idempotent gRPC retries, Lamport clocks, and Chandy-Lamport snapshots.
    technologies: [C++, gRPC, Replication]
  - title: Sandpile Simulation
    blogPath: sandpile-simulation
    period: November 2025
    category: High-performance computing
    accent: yellow
    summary: Distributed 2D sandpile simulation using MPI domain decomposition on ARCHER2.
    highlights:
      - Re-architected a sequential simulation for distributed memory execution.
      - Implemented halo exchange and checked results against the serial model.
      - Achieved strong scaling up to 1024 processes on ARCHER2.
    technologies: [C++, MPI, ARCHER2]
  - title: Elektron Engine V2
    blogPath: elektron-engine-v2
    period: 2022 - 2023
    category: Computer graphics
    accent: dark
    summary: DirectX 11 rendering engine exploring production-minded graphics architecture and physically based rendering.
    repository: https://github.com/aditya-c2512/elektron-v2
    highlights:
      - Built GGX shading, HDRI sky rendering, glTF support, and multi-light PBR shading.
      - Added efficient texture loading, shadow mapping, and an interactive Dear ImGui interface.
    technologies: [C++, DirectX 11, HLSL]
  - title: Cirrus
    blogPath: cirrus
